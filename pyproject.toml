[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HarbourOS"
version = "0.1.0"
description = "Norwegian maritime AIS port-call intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "duckdb[json,httpfs,spatial,parquet]>=1.0.0",
    "pandas>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "dbt-duckdb>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "dagster>=1.5",
    "dbt-core>=1.5",
    "dbt-duckdb>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/HarbourOS --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
mypy_path = "src"
exclude = [
    '\.egg-info',
    'build',
    'dist',
    '\.venv',
    'venv',
]
