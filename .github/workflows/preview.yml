name: Dashboard preview

# Build the dashboard from a branch and publish it to a Cloudflare preview
# address (https://<branch>.harbouros.pages.dev), without collecting any data.
# It is for trying out dashboard changes: a full Pipeline run on a branch would
# wait behind the hourly runs on master, and could bump the next one out of the
# queue and stop the chain.
#
# It does write to the warehouse, but only the Gold models the dashboard reads
# that are cheap to rebuild from Silver (dim_vessel and fct_vessel_track), so a
# branch that adds a column or a model can be previewed before it is merged.
# The next Pipeline run on master rebuilds them as master defines them.
#
# It runs on every push to a branch named dashboard-*, and can be started by
# hand (Actions → Dashboard preview → Run workflow) once this file is on master;
# GitHub only offers that button for workflows on the default branch.
on:
  push:
    branches: ["dashboard-*"]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.ref_name != 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # To push the screenshots to the preview-screenshots branch.
      contents: write

    env:
      HARBOUROS_DB: md:harbouros
      motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Rebuild the Gold models the dashboard reads
        working-directory: dbt
        run: uv run dbt build --select dim_vessel fct_vessel_track

      - name: TEMP look at stays of about 36 hours
        run: |
          uv run python - <<'PY'
          from HarbourOS.storage import connect
          c = connect("md:harbouros")
          q = """
            select round(minutes_alongside / 60) as h, completeness, count(*) n,
                   min(berth_start) b0, max(berth_start) b1, min(berth_end) e0, max(berth_end) e1
            from fact_port_call
            where berth_start > (select max(message_time) from ais_messages_silver) - interval 7 days
              and minutes_alongside between 30 * 60 and 42 * 60
            group by all order by n desc limit 15
          """
          print(c.sql(q))
          print(c.sql("select date_trunc('hour', message_time) h, count(*) from ais_messages_silver where message_time > now() - interval 4 days group by 1 order by 1"))
          PY

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build the dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Publish to a preview address
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboard/dist --project-name harbouros --branch ${{ github.ref_name }} --commit-dirty=true

      # Pictures of the preview, pushed to the preview-screenshots branch
      # (one folder per branch), so it can be checked from GitHub or a clone.
      # Only a helper for reviewing: it never fails the run.
      - name: Take screenshots
        continue-on-error: true
        working-directory: dashboard
        env:
          CHROME_CHANNEL: chrome
          SHOTS_BRANCH: preview-screenshots
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          npm install --no-save playwright@1
          node scripts/screenshots.mjs dist "$RUNNER_TEMP/shots"
          cd "$RUNNER_TEMP"
          git clone --quiet --depth 1 --branch "$SHOTS_BRANCH" \
            "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" repo \
            || { git init --quiet repo && git -C repo checkout --quiet -b "$SHOTS_BRANCH" \
                 && git -C repo remote add origin "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git"; }
          rm -rf "repo/$SOURCE_BRANCH" && mkdir -p "repo/$SOURCE_BRANCH"
          cp shots/* "repo/$SOURCE_BRANCH/"
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Screenshots of $SOURCE_BRANCH at ${GITHUB_SHA::7}"
          git push --quiet origin "$SHOTS_BRANCH"
