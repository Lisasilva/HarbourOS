name: Dashboard preview

# Build the dashboard from a branch and publish it to a Cloudflare preview
# address (https://<branch>.harbouros.pages.dev), without collecting any data.
# It is for trying out dashboard changes: a full Pipeline run on a branch would
# wait behind the hourly runs on master, and could bump the next one out of the
# queue and stop the chain.
#
# It reads master's Gold tables as they are. Only when the branch changes the
# dbt project does it rebuild the two cheap models the dashboard reads
# (dim_vessel and fct_vessel_track), so a new column or model can be previewed
# before it is merged; the next Pipeline run on master rebuilds them as master
# defines them. Skipping that otherwise keeps previews from writing to the
# warehouse while the live pipeline might be.
#
# It runs on every push to a branch named dashboard-*, and can be started by
# hand (Actions → Dashboard preview → Run workflow) once this file is on master;
# GitHub only offers that button for workflows on the default branch.
on:
  push:
    branches: ["dashboard-*"]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.ref_name != 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # To push the screenshots to the preview-screenshots branch.
      contents: write

    env:
      HARBOUROS_DB: md:harbouros
      motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, to compare the branch with master below.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Rebuild the Gold models the dashboard reads, if the branch changes them
        working-directory: dbt
        run: |
          if git diff --quiet origin/master...HEAD -- .; then
            echo "The branch doesn't change dbt; using master's Gold tables."
          else
            uv run dbt build --select dim_vessel fct_vessel_track
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # The reliability check, without saving: its result goes to a file the
      # dashboard reads instead of the warehouse (see reliability.json.py).
      - name: Check 100 random port calls against OpenStreetMap (without saving)
        continue-on-error: true
        run: uv run python -m HarbourOS.reliability --no-save --json "$RUNNER_TEMP/reliability.json"

      # The dashboard's libraries (d3, maplibre, ...) are downloaded from npm
      # during the build. Keeping them between runs means a hiccup at npm can't
      # stop the site from updating (run #106 failed on exactly that). Only
      # the libraries are kept, never the data.
      - name: Keep the dashboard's libraries between runs
        uses: actions/cache@v6
        with:
          path: dashboard/src/.observablehq/cache/_npm
          key: dashboard-npm-${{ hashFiles('dashboard/src/**/*.md', 'dashboard/package-lock.json') }}
          restore-keys: dashboard-npm-

      - name: Build the dashboard
        working-directory: dashboard
        env:
          RELIABILITY_JSON: ${{ runner.temp }}/reliability.json
        run: |
          npm ci
          # Try up to three times in case npm is briefly unreachable.
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "Build attempt $attempt failed; retrying in 30 seconds."
            sleep 30
          done
          exit 1

      - name: Publish to a preview address
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboard/dist --project-name harbouros --branch ${{ github.ref_name }} --commit-dirty=true

      # Pictures of the preview, pushed to the preview-screenshots branch
      # (one folder per branch), so it can be checked from GitHub or a clone.
      # Only a helper for reviewing: it never fails the run.
      - name: Take screenshots
        continue-on-error: true
        working-directory: dashboard
        env:
          CHROME_CHANNEL: chrome
          SHOTS_BRANCH: preview-screenshots
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          npm install --no-save playwright@1
          node scripts/screenshots.mjs dist "$RUNNER_TEMP/shots"
          cd "$RUNNER_TEMP"
          git clone --quiet --depth 1 --branch "$SHOTS_BRANCH" \
            "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" repo \
            || { git init --quiet repo && git -C repo checkout --quiet -b "$SHOTS_BRANCH" \
                 && git -C repo remote add origin "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git"; }
          rm -rf "repo/$SOURCE_BRANCH" && mkdir -p "repo/$SOURCE_BRANCH"
          cp shots/* "repo/$SOURCE_BRANCH/"
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Screenshots of $SOURCE_BRANCH at ${GITHUB_SHA::7}"
          # Two branches' previews can finish together; each writes its own
          # folder, so catching up with the other's commit is always safe.
          for attempt in 1 2 3; do
            git push --quiet origin "$SHOTS_BRANCH" && break
            git pull --quiet --rebase origin "$SHOTS_BRANCH"
          done
