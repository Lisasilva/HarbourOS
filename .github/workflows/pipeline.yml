name: Pipeline

# Hourly, plus a manual button. Hourly rather than more often because GitHub's
# cron is approximate and can run late under load, so a tighter cadence would
# promise a regularity it cannot keep -- and because the state machine's gap
# tolerance has to be set from whatever cadence actually lands.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# Never let two runs write to the warehouse at the same time.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      # The warehouse is MotherDuck, not a local file.
      HARBOUROS_DB: md:harbouros
      # Lowercase only: GitHub treats environment names case-insensitively, so
      # it will not accept MOTHERDUCK_TOKEN and motherduck_token together.
      # DuckDB reads the lowercase one, so that is the one we define.
      motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
      BARENTSWATCH_CLIENT_ID: ${{ secrets.BARENTSWATCH_CLIENT_ID }}
      BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Ingest live AIS positions
        run: uv run python -m HarbourOS.ingestion

      - name: Build Silver, state periods and port calls
        run: uv run python -m HarbourOS.transform

      - name: Build the Gold star schema
        working-directory: dbt
        run: uv run dbt build

      # Publish the dashboard. It runs only if every step above succeeded, so
      # the live site never shows a half-built warehouse. The Python data
      # loader in dashboard/src/data reads the fresh Gold tables from
      # MotherDuck during the build, using the same credentials as above.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build the dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Deploy the dashboard to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboard/dist --project-name harbouros
