name: Pipeline

# Each run collects AIS snapshots every 10 minutes for about five and a half
# hours, then builds and publishes everything once. The state machine can only
# join sightings of a ship that are at most 30 minutes apart, so one snapshot
# per run was never enough: GitHub starts scheduled runs hours late, and the
# gaps swallowed the port calls.
#
# The schedule fires hourly, at :17 because GitHub is busiest on the hour.
# While a run is collecting, the concurrency group below holds the next one in
# the queue, so a new run starts as soon as the last one finishes and the
# collection is close to continuous.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      collect_minutes:
        description: "Minutes to collect before building (use a small number to test)"
        default: "330"

# Never let two runs write to the warehouse at the same time.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # GitHub stops any job at 6 hours. Collection takes 330 minutes; the rest
    # is setup, transforms, dbt and the dashboard.
    timeout-minutes: 355

    env:
      # The warehouse is MotherDuck, not a local file.
      HARBOUROS_DB: md:harbouros
      # Lowercase only: GitHub treats environment names case-insensitively, so
      # it will not accept MOTHERDUCK_TOKEN and motherduck_token together.
      # DuckDB reads the lowercase one, so that is the one we define.
      motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
      BARENTSWATCH_CLIENT_ID: ${{ secrets.BARENTSWATCH_CLIENT_ID }}
      BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Collect live AIS positions every 10 minutes
        env:
          COLLECT_MINUTES: ${{ inputs.collect_minutes || '330' }}
        run: uv run python -m HarbourOS.collect --minutes "$COLLECT_MINUTES" --every 10

      - name: Build Silver, state periods and port calls
        run: uv run python -m HarbourOS.transform

      - name: Build the Gold star schema
        working-directory: dbt
        run: uv run dbt build

      # Publish the dashboard. It runs only if every step above succeeded, so
      # the live site never shows a half-built warehouse. The Python data
      # loader in dashboard/src/data reads the fresh Gold tables from
      # MotherDuck during the build, using the same credentials as above.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build the dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Deploy the dashboard to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboard/dist --project-name harbouros --commit-dirty=true
