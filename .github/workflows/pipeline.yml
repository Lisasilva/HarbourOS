name: Pipeline

# Each run collects AIS snapshots every 10 minutes for 50 minutes, then builds
# and publishes everything once, so the dashboard updates about every hour.
# (Runs used to collect for 330 minutes; that is still the way to go back to
# about 4 updates a day and less MotherDuck compute: change the two "50"s.)
#
# The state machine can only join sightings of a ship that are at most 30 minutes apart, so one snapshot
# per run was never enough: GitHub starts scheduled runs hours late, and the
# gaps swallowed the port calls.
#
# The schedule fires hourly, at :17 because GitHub is busiest on the hour.
# While a run is collecting, the concurrency group below holds the next one in
# the queue, so a new run starts as soon as the last one finishes and the
# collection is close to continuous.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      collect_minutes:
        description: "Minutes to collect before building (use a small number to test)"
        default: "50"
      full_refresh:
        description: "Rebuild the Gold port calls from scratch (after changing the port list or matching rules)"
        type: boolean
        default: false

# Never let two runs write to the warehouse at the same time.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # GitHub stops any job at 6 hours. A scheduled run collects for 50
    # minutes, but a manual one can ask for up to about 330; the rest is
    # setup, transforms, dbt and the dashboard.
    timeout-minutes: 355

    env:
      # The warehouse is MotherDuck, not a local file.
      HARBOUROS_DB: md:harbouros
      # Lowercase only: GitHub treats environment names case-insensitively, so
      # it will not accept MOTHERDUCK_TOKEN and motherduck_token together.
      # DuckDB reads the lowercase one, so that is the one we define.
      motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
      BARENTSWATCH_CLIENT_ID: ${{ secrets.BARENTSWATCH_CLIENT_ID }}
      BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Collect live AIS positions every 10 minutes
        env:
          COLLECT_MINUTES: ${{ inputs.collect_minutes || '50' }}
        run: uv run python -m HarbourOS.collect --minutes "$COLLECT_MINUTES" --every 10

      - name: Build Silver, state periods and port calls
        run: uv run python -m HarbourOS.transform

      # The fact table is incremental: each run only re-matches ships with new
      # data. When the port list or the matching rules change, the older rows
      # need matching again, and "full_refresh" does that once.
      #
      # When the model gains or loses a column, an incremental run can't
      # update the existing table, so dbt stops with "schemas ... are out of
      # sync". That is expected after such a change, so rebuild from scratch
      # instead of failing every run until someone does it by hand.
      - name: Build the Gold star schema
        working-directory: dbt
        env:
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: |
          set -o pipefail
          if [ "$FULL_REFRESH" = "true" ]; then
            uv run dbt build --full-refresh
          elif uv run dbt build | tee dbt-build.log; then
            :
          elif grep -q "schemas on this incremental model are out of sync" dbt-build.log; then
            echo "::warning::The fact table's columns changed; rebuilding it from scratch"
            uv run dbt build --full-refresh
          else
            exit 1
          fi

      # Publish the dashboard. It runs only if every step above succeeded, so
      # the live site never shows a half-built warehouse. The Python data
      # loader in dashboard/src/data reads the fresh Gold tables from
      # MotherDuck during the build, using the same credentials as above.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build the dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Deploy the dashboard to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboard/dist --project-name harbouros --commit-dirty=true
