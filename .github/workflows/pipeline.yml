name: Pipeline

# Each run collects AIS snapshots every 10 minutes for 50 minutes, then builds
# and publishes everything once, so the dashboard updates about every hour.
# (Runs used to collect for 330 minutes; that is still the way to go back to
# about 4 updates a day and less MotherDuck compute: change the two "50"s.)
#
# The state machine can only join sightings of a ship that are at most 30
# minutes apart, so one snapshot per run was never enough: GitHub starts
# scheduled runs hours late, and the gaps swallowed the port calls.
#
# Each run on master starts the next one when it ends (the last step below),
# so collection never pauses. GitHub's own schedule can't be trusted for that:
# on 2026-09-28 no hourly trigger fired for almost two hours. The schedule
# stays only as a backstop that restarts the chain if it ever breaks, for
# example after a run is cancelled by hand. While a run is collecting, the
# concurrency group below keeps at most one more run waiting, so the chain and
# the backstop never pile up; one that gets replaced shows as "cancelled".
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      collect_minutes:
        description: "Minutes to collect before building (use a small number to test)"
        default: "50"
      full_refresh:
        description: "Rebuild all port calls from scratch (after changing the port list or the port-call or matching rules)"
        type: boolean
        default: false

# Never let two runs write to the warehouse at the same time.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # GitHub stops any job at 6 hours. A scheduled run collects for 50
    # minutes, but a manual one can ask for up to about 330; the rest is
    # setup, transforms, dbt and the dashboard.
    timeout-minutes: 355

    permissions:
      contents: read
      # To start the next run, and to open or close the failure-alert issue.
      actions: write
      issues: write

    env:
      # The warehouse is MotherDuck, not a local file.
      HARBOUROS_DB: md:harbouros
      # Lowercase only: GitHub treats environment names case-insensitively, so
      # it will not accept MOTHERDUCK_TOKEN and motherduck_token together.
      # DuckDB reads the lowercase one, so that is the one we define.
      motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}
      BARENTSWATCH_CLIENT_ID: ${{ secrets.BARENTSWATCH_CLIENT_ID }}
      BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Collect live AIS positions every 10 minutes
        env:
          COLLECT_MINUTES: ${{ inputs.collect_minutes || '50' }}
        run: uv run python -m HarbourOS.collect --minutes "$COLLECT_MINUTES" --every 10

      # "full_refresh" also re-derives every ship's port calls. That happens
      # by itself, once, after the rules in port_calls.py change (see
      # RULES_VERSION there), and the step then leaves a port-calls-rebuilt
      # file so the Gold step below rebuilds the fact table too.
      - name: Build Silver, state periods and port calls
        env:
          REBUILD_PORT_CALLS: ${{ inputs.full_refresh }}
        run: uv run python -m HarbourOS.transform

      # The fact table is incremental: each run only re-matches ships with new
      # data. When the port list or the matching rules change, the older rows
      # need matching again, and "full_refresh" does that once.
      #
      # It is also rebuilt from scratch when every ship's port calls were just
      # re-derived (the port-calls-rebuilt file), since those rows aren't newer.
      #
      # When the model gains or loses a column, an incremental run can't
      # update the existing table, so dbt stops with "schemas ... are out of
      # sync". That is expected after such a change, so rebuild from scratch
      # instead of failing every run until someone does it by hand.
      - name: Build the Gold star schema
        working-directory: dbt
        env:
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: |
          set -o pipefail
          if [ "$FULL_REFRESH" = "true" ] || [ -f ../port-calls-rebuilt ]; then
            uv run dbt build --full-refresh
          elif uv run dbt build | tee dbt-build.log; then
            :
          elif grep -q "schemas on this incremental model are out of sync" dbt-build.log; then
            echo "::warning::The fact table's columns changed; rebuilding it from scratch"
            uv run dbt build --full-refresh
          else
            exit 1
          fi

      # Publish the dashboard. It runs only if every step above succeeded, so
      # the live site never shows a half-built warehouse. The Python data
      # loader in dashboard/src/data reads the fresh Gold tables from
      # MotherDuck during the build, using the same credentials as above.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build the dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Deploy the dashboard to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboard/dist --project-name harbouros --commit-dirty=true

      # Tell Maria when a run fails: GitHub emails her about new issues and
      # comments. One open issue collects all failures until a run succeeds.
      - name: Open or update the failure alert
        if: failure() && github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Pipeline is failing"' --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --title "Pipeline is failing" \
              --body "Run $RUN_URL failed, so the dashboard was not updated. This issue closes itself when a run succeeds."
          fi

      - name: Close the failure alert
        if: success() && github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for issue in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search 'in:title "Pipeline is failing"' --json number --jq '.[].number'); do
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Fixed: $RUN_URL succeeded."
          done

      # Start the next run, whether this one succeeded or failed, so collection
      # carries on. Not after a cancel (someone stopped it on purpose), and not
      # on test branches.
      - name: Start the next run
        if: ${{ !cancelled() && github.ref_name == 'master' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pipeline.yml --repo "$GITHUB_REPOSITORY" --ref master
