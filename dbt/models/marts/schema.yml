version: 2

models:
  - name: dim_port
    description: Norwegian and Svalbard seaports from UN/LOCODE, positions in decimal degrees.
    columns:
      - name: port_locode
        description: UN/LOCODE business key, e.g. NOBGO for Bergen.
        tests: [unique, not_null]
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]

  - name: dim_vessel
    description: One row per vessel observed, with its most recently reported name and type.
    columns:
      - name: mmsi
        tests: [unique, not_null]
      - name: ship_category
        description: The AIS ship type grouped into cargo, tanker, passenger (includes ferries), and so on.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - fishing
                  - towing / tug
                  - pilot, rescue, service
                  - passenger
                  - cargo
                  - tanker
                  - leisure
                  - unknown
                  - other

  - name: fct_vessel_track
    description: >
      Each ship's position once per 10-minute slot over the last 7 days, for
      drawing routes. Grain: one ship in one slot.
    columns:
      - name: mmsi
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vessel')
                field: mmsi
      - name: slot_start
        tests: [not_null]
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]

  - name: dim_date
    description: Calendar covering exactly the days observed in the AIS data.
    columns:
      - name: date_key
        tests: [unique, not_null]

  - name: fact_port_call
    description: >
      One row per port call. Grain: one vessel stopping once. A null
      port_locode means no known seaport lay within the match radius --
      recorded honestly rather than guessed.
    columns:
      - name: port_call_key
        tests: [unique, not_null]
      - name: mmsi
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vessel')
                field: mmsi
      - name: port_locode
        tests:
          - relationships:
              arguments:
                to: ref('dim_port')
                field: port_locode
      - name: visit_type
        description: >
          'fish_farm' when the stop was within 300 m of a fish farm;
          otherwise 'port_call' when a seaport was matched within
          port_match_km and the ship was within berth_match_m of an official
          Kystverket berth; 'anchorage' when it stopped near a port but not
          at a berth, or near an official anchorage; and 'at_sea' for the
          rest (rigs, offshore fields).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["port_call", "anchorage", "at_sea", "fish_farm"]
      - name: fish_farm_name
        description: The fish farm's name, for fish_farm stops (may be null if unnamed).
      - name: berth_name
        description: The nearest quay, ferry quay, port facility or harbour in Kystverket's register (within about 3 km).
      - name: berth_m
        description: Metres from the stop to berth_name.
      - name: anchorage_name
        description: The official anchorage within anchorage_m (1,500 m) of the stop, if any.
      - name: arrival_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: stop_type
        tests:
          - accepted_values:
              arguments:
                values: ["berthed", "anchored"]
      - name: completeness
        tests:
          - accepted_values:
              arguments:
                values:
                  - complete
                  - arrival_unobserved
                  - departure_unobserved
                  - both_unobserved
      - name: minutes_alongside
        tests: [not_null]
      - name: status_confidence
        tests: [not_null]
      - name: confidence
        tests: [not_null]
